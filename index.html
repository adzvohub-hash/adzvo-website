<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default title/description for crawlers that don't run JavaScript. Removed on load; each page then sets its own (see src/routes/__root.tsx). -->
    <meta name="description" content="ADZVO is a Bangalore creative and digital agency for branding, websites, digital marketing, video and AI, helping brands across India grow. Let's talk." data-static-seo />
    <title data-static-seo>Creative &amp; Digital Marketing Agency in Bangalore | ADZVO</title>
    <!-- Link previews for WhatsApp, LinkedIn, Facebook and X. These apps don't run JavaScript, so they only ever read these tags.
         Removed on load like the two above; each page then sets its own (same image). -->
    <meta property="og:type" content="website" data-static-seo />
    <meta property="og:site_name" content="ADZVO" data-static-seo />
    <meta property="og:url" content="https://adzvo.com/" data-static-seo />
    <meta property="og:title" content="Creative &amp; Digital Marketing Agency in Bangalore | ADZVO" data-static-seo />
    <meta property="og:description" content="ADZVO is a Bangalore creative and digital agency for branding, websites, digital marketing, video and AI, helping brands across India grow. Let's talk." data-static-seo />
    <meta property="og:image" content="https://adzvo.com/og-image.jpg" data-static-seo />
    <meta property="og:image:width" content="1200" data-static-seo />
    <meta property="og:image:height" content="630" data-static-seo />
    <meta property="og:image:alt" content="ADZVO — Ideas That Inspire. Digital That Delivers." data-static-seo />
    <meta name="twitter:card" content="summary_large_image" data-static-seo />
    <meta name="twitter:image" content="https://adzvo.com/og-image.jpg" data-static-seo />
    <meta name="color-scheme" content="light" />
    <!-- Apply the saved (or system) theme before first paint, so there's no flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("adzvo-theme");
          if (t !== "light" && t !== "dark") t = "light"; // light by default; dark only when the visitor picks it
          var r = document.documentElement;
          r.classList.toggle("dark", t === "dark");
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <!-- Structured data: tells Google who ADZVO is (name, site, logo, phone). Not removed on load, so every page carries it.
         TODO when the company is registered: add "address" (PostalAddress). TODO when social profiles exist: add "sameAs": [urls]. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://adzvo.com/#organization",
          "name": "ADZVO",
          "url": "https://adzvo.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://adzvo.com/logo-512.png",
            "width": 512,
            "height": 512
          },
          "image": "https://adzvo.com/og-image.jpg",
          "description": "ADZVO is a Bangalore creative and digital agency for branding, websites, digital marketing, video and AI, helping brands across India grow.",
          "areaServed": ["India", "GCC"],
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "telephone": "+91-70123-76221",
              "contactType": "customer service",
              "areaServed": "IN",
              "availableLanguage": ["English"]
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://adzvo.com/#website",
          "url": "https://adzvo.com/",
          "name": "ADZVO",
          "publisher": { "@id": "https://adzvo.com/#organization" },
          "inLanguage": "en"
        }
      ]
    }
    </script>
    <!-- Google tag (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T4NCYNBCT6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T4NCYNBCT6', { send_page_view: false });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
