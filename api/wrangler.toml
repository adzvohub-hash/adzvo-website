name = "adzvo-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "adzvo-db"
database_id = "445b7f4c-c41f-45ef-8cf3-59ba6bb6d18a"
preview_database_id = "445b7f4c-c41f-45ef-8cf3-59ba6bb6d18a"

# R2 bucket binding
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "adzvo-media"
preview_bucket_name = "adzvo-media"

# Environment variables (secrets — set via `wrangler secret put`)
# JWT_SECRET     — used to sign admin tokens
# ADMIN_USERNAME — admin login username
# ADMIN_PASSWORD — admin login password (store hashed in production)

[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "https://adzvo.com,https://adzvo-website.adzvohub.workers.dev,http://localhost:5173"

# Dev overrides
[env.dev.vars]
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:5173"
ADMIN_USERNAME = "adzvoadmin"
ADMIN_PASSWORD = "adzvoadmin"
JWT_SECRET = "local-dev-secret-not-for-production"
