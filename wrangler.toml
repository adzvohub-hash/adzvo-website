# Cloudflare Pages configuration
# Deploy via: npx wrangler pages deploy .output/public
# Or connect your GitHub repo in the Cloudflare Pages dashboard with:
#   Build command:        npm run build
#   Build output dir:     .output/public
#   Node.js version:      20

name = "adzvo-business-showcase"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Pages-specific: points to the SSR worker generated by Nitro (cloudflare-pages preset).
# Nitro writes the edge worker to .output/server/_worker.js automatically.
pages_build_output_dir = ".output/public"
